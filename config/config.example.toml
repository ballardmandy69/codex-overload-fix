# ---------------------------------------------------------------------------
# 将以下内容追加到 Codex 配置文件：
#   macOS: ~/.codex/config.toml
#   Windows: %USERPROFILE%\.codex\config.toml
# 修改前请先备份配置；修改后完全退出并重启 Codex。
# ---------------------------------------------------------------------------

model_provider = "openai-retry"

[model_providers.openai-retry]
name = "OpenAI (retry)"
base_url = "http://127.0.0.1:8787"
wire_api = "responses"

# 复用 Codex 已有的 ChatGPT OAuth，不需要重新登录，不改变套餐，也不需要单独的 API key。
# 中继按原样转发 Authorization 和账号相关请求头。
requires_openai_auth = true

# 由中继负责 overload 重试。关闭客户端重放，避免已提交的流被再次发送。
stream_max_retries = 0
request_max_retries = 0

# model_provider 必须位于 config.toml 顶层，并放在其他 [table] 之前。

# ---------------------------------------------------------------------------
# 说明
#
# * `openai` 是 Codex 的保留 provider id，不能覆盖，因此这里定义新的 provider。
#
# * 回滚时删除 `model_provider` 和 [model_providers.openai-retry] 配置块，
#   Codex 下次启动会恢复内置 provider。
#
# * 如果使用 Clash，请把 HTTP/混合端口传给中继：
#   macOS:  python3 relay/relay.py --port 8787 --clash-port 7890
#   Windows: python relay\relay.py --port 8787 --clash-port 7890
# ---------------------------------------------------------------------------
